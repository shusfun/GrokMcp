name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Draft release version (vX.Y.Z)"
        required: true
        default: "v0.1.23"
  push:
    tags:
      - "v*"

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}
  GROK_LIVE: "0"

permissions:
  contents: write

jobs:
  darwin:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install and test
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          go test ./...
      - name: Package macOS
        run: sh scripts/package.sh darwin
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: |
            dist/GrokMcp-*-darwin-amd64.dmg
            dist/GrokMcp-*-darwin-arm64.dmg
            dist/GrokMcp-*-darwin-amd64.zip
            dist/GrokMcp-*-darwin-arm64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install and test
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          go test ./...
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Package Windows
        shell: bash
        run: sh scripts/package.sh windows
      - name: Verify Windows upgrade in isolated installation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: ./scripts/test-windows-upgrade.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/GrokMcp-*-windows-amd64.zip
            dist/GrokMcp-*-windows-amd64-installer.exe
          if-no-files-found: error

  release:
    needs: [darwin, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: artifacts
        run: |
          sha256sum GrokMcp-* | sort > SHA256SUMS.txt
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version"; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > /tmp/release-draft; then
            [ "$(cat /tmp/release-draft)" = "true" ] || { echo "Refusing to overwrite a published release"; exit 1; }
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft
            gh release upload "$RELEASE_TAG" GrokMcp-* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" GrokMcp-* SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --generate-notes --title "$RELEASE_TAG"
          fi
